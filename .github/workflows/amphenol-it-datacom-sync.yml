name: Sync Amphenol IT Datacom catalog
# refresh 2026-10-05 10:24 KST

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/amphenol-it-datacom-sync.yml'
      - 'DCI/DataCenter/scripts/sync_amphenol_it_datacom.py'
  schedule:
    - cron: '17 22 * * 0'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install requests beautifulsoup4
      - name: Scrape all official IT Datacom products
        run: python DCI/DataCenter/scripts/sync_amphenol_it_datacom.py
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "DCI/DataCenter/product_catalog/Amphenol"
          if git diff --cached --quiet; then
            echo "No Amphenol catalog changes."
          else
            git commit -m "chore(datacenter): sync all 665 Amphenol IT Datacom products"
            git push
          fi
