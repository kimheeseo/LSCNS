name: Sync Amphenol IT Datacom catalog

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/amphenol-it-datacom-sync.yml'
      - 'DCI/DataCenter/scripts/sync_amphenol_it_datacom.py'

permissions:
  contents: write

concurrency:
  group: amphenol-it-datacom-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi beautifulsoup4

      - name: Sync all official Amphenol IT Datacom products
        run: python DCI/DataCenter/scripts/sync_amphenol_it_datacom.py

      - name: Validate synchronized source count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('DCI/DataCenter/product_catalog/Amphenol/it-datacom-source.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['parsedTotal'] == data['sourceTotal']
          assert data['sourceTotal'] >= 600
          print('Validated', data['sourceTotal'], 'Amphenol products in', len(data['categoryCounts']), 'categories')
          PY

      - name: Commit catalog update
        run: |
          if git diff --quiet -- DCI/DataCenter/product_catalog/Amphenol DCI/DataCenter/product_catalog/bom-catalog-index.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DCI/DataCenter/product_catalog/Amphenol DCI/DataCenter/product_catalog/bom-catalog-index.json
          git commit -m "chore(datacenter): sync all Amphenol IT Datacom products"
          git push
