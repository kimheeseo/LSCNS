name: COMSOL-style Workbench UI Regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'COMSOL/universal_silica_v01/web/index.html'
      - 'COMSOL/universal_silica_v01/web/comsol_workspace.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_workspace.css'
      - 'COMSOL/universal_silica_v01/web/comsol_ui_operations.css'
      - 'COMSOL/universal_silica_v01/web/comsol_workflow_link.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_workflow_link.css'
      - 'COMSOL/universal_silica_v01/web/tests/browser_comsol_linked_workflow.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_comsol_ui_operations.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_wave_optics_settings.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_wave_optics_settings.css'
      - 'COMSOL/universal_silica_v01/web/comsol_geometry_cad.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_comsol_wave_optics.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_parameter_geometry.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_parameter_geometry.css'
      - 'COMSOL/universal_silica_v01/web/tests/browser_comsol_parameters_geometry.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_comsol_workspace.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_startup_wizard.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_startup_wizard.css'
      - 'COMSOL/universal_silica_v01/web/tests/browser_ewfd_model_wizard.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_geometry_layers_hover.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_comsol_radial_layer_axes.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_rotate_range_selection.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_mirror_cumulative_materials.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_material_individual_domains.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_definitions_ribbon.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_definitions_right_click.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_definitions_context.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_definitions_context.css'
      - 'COMSOL/universal_silica_v01/web/comsol_pml_editor.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_pml_editor.css'
      - 'COMSOL/universal_silica_v01/web/tests/browser_pml_artificial_domains.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_adjacent_boundary_labels.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/browser_material_properties_resizers.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_panel_resizers.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_panel_resizers.css'
      - 'COMSOL/universal_silica_v01/web/comsol_adjacent_selection.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_adjacent_selection.css'
      - 'COMSOL/universal_silica_v01/web/comsol_materials_editor.mjs'
      - 'COMSOL/universal_silica_v01/web/comsol_materials_editor.css'
      - '.github/workflows/comsol-style-workbench.yml'
permissions:
  contents: read
jobs:
  gui-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check (UI skin and original solver)
        run: |
          node --check COMSOL/universal_silica_v01/web/comsol_workspace.mjs
          node --check COMSOL/universal_silica_v01/web/comsol_wave_optics_settings.mjs
          node --check COMSOL/universal_silica_v01/web/comsol_geometry_cad.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_comsol_wave_optics.mjs
          node --check COMSOL/universal_silica_v01/web/comsol_parameter_geometry.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_comsol_parameters_geometry.mjs
          node --check COMSOL/universal_silica_v01/web/app.mjs
          node --check COMSOL/universal_silica_v01/web/solver.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_comsol_workspace.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_comsol_ui_operations.mjs
          node --check COMSOL/universal_silica_v01/web/comsol_workflow_link.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_comsol_linked_workflow.mjs
          node --check COMSOL/universal_silica_v01/web/comsol_startup_wizard.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_ewfd_model_wizard.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_geometry_layers_hover.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_comsol_radial_layer_axes.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_rotate_range_selection.mjs
          node --check COMSOL/universal_silica_v01/web/comsol_materials_editor.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_mirror_cumulative_materials.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_material_individual_domains.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_definitions_ribbon.mjs
          node --check COMSOL/universal_silica_v01/web/comsol_definitions_context.mjs
          node --check COMSOL/universal_silica_v01/web/comsol_pml_editor.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_pml_artificial_domains.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_definitions_right_click.mjs
          node --check COMSOL/universal_silica_v01/web/comsol_adjacent_selection.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_adjacent_boundary_labels.mjs
          node --check COMSOL/universal_silica_v01/web/comsol_panel_resizers.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_material_properties_resizers.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --prefix /tmp/comsol-workspace-playwright playwright@1.56.1
          /tmp/comsol-workspace-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual GUI and physics feature regression (1277x695 + mobile)
        env:
          NODE_PATH: /tmp/comsol-workspace-playwright/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/comsol-workspace-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node COMSOL/universal_silica_v01/web/tests/browser_comsol_workspace.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_comsol_parameters_geometry.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_comsol_wave_optics.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_comsol_ui_operations.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_comsol_linked_workflow.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_ewfd_model_wizard.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_geometry_layers_hover.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_comsol_radial_layer_axes.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_rotate_range_selection.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_mirror_cumulative_materials.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_material_individual_domains.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_definitions_ribbon.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_definitions_right_click.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_pml_artificial_domains.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_adjacent_boundary_labels.mjs
          node COMSOL/universal_silica_v01/web/tests/browser_material_properties_resizers.mjs
      - name: Upload rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comsol-inspired-workbench-ui
          path: |
            /tmp/ls_comsol_theme_desktop.png
            /tmp/ls_comsol_theme_mobile.png
            /tmp/ls_comsol_parameters.png
            /tmp/ls_comsol_geometry.png
            /tmp/ls_waveoptics_ewfd_desktop.png
            /tmp/ls_waveoptics_results_desktop.png
            /tmp/ls_comsol_ui_operations.png
            /tmp/ls_comsol_linked_workflow.png
            /tmp/ls_comsol_ewfd_new_model_wizard.png
            /tmp/comsol_circle_radius_build.png
            /tmp/comsol_circle_hover_red.png
            /tmp/comsol_circle_multi_layer.png
            /tmp/comsol_circle_duplicate_delete.png
            /tmp/comsol_reference_two_circles_axes.png
            /tmp/comsol_rotate_initial_settings.png
            /tmp/comsol_rotate_range_dialog.png
            /tmp/comsol_rotate_c2_active_selected.png
            /tmp/comsol_six_rotated_circles.png
            /tmp/comsol_selected_two_mirrors.png
            /tmp/comsol_blank_material_domains.png
            /tmp/comsol_material_cumulative_selection.png
            /tmp/comsol_material_boundary_level.png
            /tmp/comsol_material_individual_selected_domains.png
            /tmp/comsol_material_three_holes_individual.png
            /tmp/comsol_definitions_tab_desktop.png
            /tmp/comsol_definitions_tab_mobile.png
            /tmp/comsol_adjacent_material1_before.png
            /tmp/comsol_adjacent_domain_hover.png
            /tmp/comsol_adjacent_domain_selected.png
            /tmp/comsol_adjacent_created.png
            /tmp/comsol_adjacent_two_boundaries_selected.png
            /tmp/comsol_adjacent_output_levels.png
            /tmp/comsol_material_properties_resolved.png
            /tmp/comsol_material_valid_status_checks.png
            /tmp/comsol_definitions_rightclick_menu.png
            /tmp/comsol_pml_definitions_context.png
            /tmp/comsol_pml_three_domains_settings.png
            /tmp/comsol_pml_custom_settings.png
            /tmp/comsol_material_index_black_active.png
            /tmp/comsol_resized_material_settings.png
          if-no-files-found: ignore
