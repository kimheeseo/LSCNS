name: COMSOL fiber research v1
on:
  push:
    paths:
      - 'COMSOL/universal_silica_v01/fiber_research_v1/**'
      - 'COMSOL/universal_silica_v01/web/research_fiber_v1.mjs'
      - 'COMSOL/universal_silica_v01/web/index.html'
      - 'COMSOL/universal_silica_v01/web/research_step3_v085.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/*research_step3_v085*'
      - 'COMSOL/universal_silica_v01/web/research_design_mesh_v084.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/*research_design_mesh_v084*'
      - 'COMSOL/universal_silica_v01/web/research_step4_v080.mjs'
      - 'COMSOL/universal_silica_v01/web/research_step6a_v081.mjs'
      - 'COMSOL/universal_silica_v01/web/research_step6b_v082.mjs'
      - 'COMSOL/universal_silica_v01/web/research_step5_v083*'
      - 'COMSOL/universal_silica_v01/web/research_step6_v088.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/*step6_v088*'
      - 'COMSOL/universal_silica_v01/web/*validation*v089*'
      - 'COMSOL/universal_silica_v01/web/tests/*validation*v089*'
      - 'COMSOL/universal_silica_v01/web/*architecture*v0810*'
      - 'COMSOL/universal_silica_v01/web/result_contract_v0810.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/*v0810*'
      - '.github/workflows/comsol_fiber_research_v1.yml'
  workflow_dispatch:
jobs:
  python-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Gmsh OpenGL shared libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install Python dependencies
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: python -m pip install -r requirements.txt
      - name: Syntax compilation and tests
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Independent STEP3 V1 V4 V5 benchmarks
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: python validate_step3.py --out /tmp/step3_validation
      - name: STEP4 physical integration and tracked dispersion
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: python validate_step4_v086.py --out /tmp/step4_validation
      - name: STEP5 vector Maxwell bands and independent TE TM reference
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: python validate_step5_v087.py --out /tmp/step5_validation
      - name: STEP6 actual bend thermal PM N-core grid and coupling
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: python validate_step6_v088.py --out /tmp/step6_validation
      - name: STEP7 evidence gated V1 V9 suite and actual FSM ARF probes
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: python validate_step7_v089.py --step3-report /tmp/step3_validation/step3_validation.json --out /tmp/step7_validation
      - name: STEP8 stable CLI provenance and actual Gauss basis
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: |
          python -m lswave.cli solve benchmarks/step3_v085/guided_input.json --target-neff 1.468524 --out /tmp/step8_result.json
          python -m lswave.cli verify /tmp/step8_result.json
      - name: Compute genuine scalar STEP5 example bands
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: |
          python step5_cli.py example --out /tmp/step5_design.json
          python step5_cli.py analyze /tmp/step5_design.json --out /tmp/step5_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw = json.loads(Path("/tmp/step5_result.json").read_text())
          print("STEP5_SAMPLE_JSON="+json.dumps(raw,separators=(",",":"),ensure_ascii=False))
          print("STEP5_CANDIDATES=",len(raw["gap_map"]["candidates"]))
          PY
      - name: Static web module syntax
        run: |
          node --test COMSOL/universal_silica_v01/web/tests/test_result_contract_v0810.mjs
          node --check COMSOL/universal_silica_v01/web/research_architecture_v0810.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_architecture_v0810.cjs
          node --test COMSOL/universal_silica_v01/web/tests/test_validation_csv_v089.mjs
          node --check COMSOL/universal_silica_v01/web/research_validation_v089.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_validation_v089.cjs
          node --test COMSOL/universal_silica_v01/web/tests/test_research_step6_v088.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_research_step6_v088.cjs
          node --check COMSOL/universal_silica_v01/web/research_fiber_v1.mjs
          node --test COMSOL/universal_silica_v01/web/tests/test_research_step3_v085.mjs
          node --check COMSOL/universal_silica_v01/web/tests/browser_research_step3_v085.cjs
          node --check COMSOL/universal_silica_v01/web/research_design_mesh_v084.mjs
          node --test COMSOL/universal_silica_v01/web/tests/test_research_design_mesh_v084.mjs
          node --check COMSOL/universal_silica_v01/web/research_step4_v080.mjs
          node --check COMSOL/universal_silica_v01/web/research_step6a_v081.mjs
          node --check COMSOL/universal_silica_v01/web/research_step6b_v082.mjs
          node --check COMSOL/universal_silica_v01/web/research_step5_v083.mjs
      - name: JSON-schema check for each design preset
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path("fiber_design.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          validate=Draft202012Validator(schema).validate
          presets=json.loads(Path("presets.json").read_text())
          for title,design in presets.items():
              validate(design)
          print("JSON schema checked:",len(presets),"A-H presets")
          from step5_vector_pwe import example_config
          pwe_schema=json.loads(Path("step5_vector.schema.json").read_text())
          Draft202012Validator.check_schema(pwe_schema)
          Draft202012Validator(pwe_schema).validate(example_config())
          print("STEP5 vector schema checked")
          PY
      - name: CLI JSON roundtrip
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: |
          python cli.py presets --out /tmp/ls-fiber-presets
          python cli.py validate /tmp/ls-fiber-presets/index_guiding__step.json

      - name: Generate all 25 default geometries and measure walls
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: python validate_step12.py --out /tmp/step12_validation_summary.json
      - name: Generate actual browser mesh fixture
        working-directory: COMSOL/universal_silica_v01/fiber_research_v1
        run: python cli.py mesh benchmarks/step12_bragg_mesh_input.json --out /tmp/ls-step12-mesh
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix /tmp/ls-step12-browser playwright
          ls_research_browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$ls_research_browser" ]; then
            printf 'CHROMIUM_PATH=%s\n' "$ls_research_browser" >> "$GITHUB_ENV"
          else
            /tmp/ls-step12-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Verify mesh import, stale-result handling and mobile panel
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/ls-step12-http.log 2>&1 &
          ls_mesh_http_pid=$!
          trap 'kill "$ls_mesh_http_pid"' EXIT
          NODE_PATH=/tmp/ls-step12-browser/node_modules RESULT_PATH=/tmp/step12_browser_check.json node COMSOL/universal_silica_v01/web/tests/browser_research_design_mesh_v084.cjs /tmp/ls-step12-mesh/mesh_preview.json
      - name: Verify actual workbench STEP3 navigation and computed fields
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/ls-step3-http.log 2>&1 &
          ls_step3_http_pid=$!
          trap 'kill "$ls_step3_http_pid"' EXIT
          NODE_PATH=/tmp/ls-step12-browser/node_modules RESULT_PATH=/tmp/step3_browser_check.json SCREENSHOT_PATH=/tmp/step3_panel.png node COMSOL/universal_silica_v01/web/tests/browser_research_step3_v085.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step12-v084-and-step3-v085-validation
          path: |
            /tmp/step12_validation_summary.json
            /tmp/step12_browser_check.json
            /tmp/step3_validation/step3_validation.json
            /tmp/step3_browser_check.json
            /tmp/step3_panel.png
            /tmp/step4_validation/validation.json
            /tmp/step5_validation/validation.json
            /tmp/step5_validation/convergence.json
            /tmp/step6_validation/validation.json
            /tmp/step7_validation/validation.json
            /tmp/step7_validation/arf_resonance.json
            /tmp/step7_validation/pcf_fsm.json
