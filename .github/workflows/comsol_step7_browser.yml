name: COMSOL STEP7 validation browser
on:
  push:
    paths:
      - 'COMSOL/universal_silica_v01/web/index.html'
      - 'COMSOL/universal_silica_v01/web/research_fiber_v1.mjs'
      - 'COMSOL/universal_silica_v01/web/*validation*v089*'
      - 'COMSOL/universal_silica_v01/web/tests/*validation*v089*'
      - '.github/workflows/comsol_step7_browser.yml'
  workflow_dispatch:
jobs:
  actual-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: |
          npm install --prefix /tmp/ls-step7-browser playwright
          ls_step7_browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$ls_step7_browser" ]; then
            printf 'CHROMIUM_PATH=%s\n' "$ls_step7_browser" >> "$GITHUB_ENV"
          else
            /tmp/ls-step7-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Verify verdicts missing evidence and COMSOL CSV import
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/ls-step7-http.log 2>&1 &
          ls_step7_http_pid=$!
          trap 'kill "$ls_step7_http_pid"' EXIT
          NODE_PATH=/tmp/ls-step7-browser/node_modules RESULT_PATH=/tmp/step7_browser_check.json node COMSOL/universal_silica_v01/web/tests/browser_validation_v089.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step7-browser-validation
          path: /tmp/step7_browser_check.json
