name: GN model paper validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '2026_KICS_Fall_10/GN_model/*.py'
      - '2026_KICS_Fall_10/GN_model/*.csv'
      - '2026_KICS_Fall_10/GN_model/*.ipynb'
      - '2026_KICS_Fall_10/gn_integral_general*.py'
      - '.github/workflows/gn-model-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r 2026_KICS_Fall_10/GN_model/requirements.txt
      - name: Execute both paper validations and notebook
        run: python 2026_KICS_Fall_10/GN_model/execute_notebook.py
      - uses: actions/upload-artifact@v4
        with:
          name: gn-validation-current
          path: |
            2026_KICS_Fall_10/GN_model/result/
            2026_KICS_Fall_10/GN_model/GN_Model_Colab.ipynb
