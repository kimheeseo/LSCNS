name: GN model paper validation

on:
  workflow_dispatch:
  push:
    branches:
      - gn-model-validation-20260920
    paths:
      - "2026_KICS_Fall_10/GN_model/*.py"
      - "2026_KICS_Fall_10/GN_model/*.csv"
      - "2026_KICS_Fall_10/GN_model/*.ipynb"
      - "2026_KICS_Fall_10/GN_model/requirements.txt"
      - ".github/workflows/gn-model-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gn-model-validation-20260920
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 2026_KICS_Fall_10/GN_model/requirements.txt

      - name: Paper 1 reproducibility
        run: python 2026_KICS_Fall_10/GN_model/paper1_reproducibility.py

      - name: Paper 2 Figure 5 and EGN benchmark
        run: python 2026_KICS_Fall_10/GN_model/figure5_benchmark.py

      - name: Build executed Colab report
        run: |
          cp 2026_KICS_Fall_10/GN_model/GN_Model_Colab.ipynb 2026_KICS_Fall_10/GN_model/results/GN_Model_Colab_executed.ipynb
          jupyter nbconvert --to notebook --execute --inplace 2026_KICS_Fall_10/GN_model/results/GN_Model_Colab_executed.ipynb --ExecutePreprocessor.timeout=180

      - name: Write execution report
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          d=Path("2026_KICS_Fall_10/GN_model")
          r=d/"results"
          p1=json.loads((r/"paper1_reproducibility.json").read_text())
          s=json.loads((r/"summary.json").read_text())
          e=pd.read_csv(r/"paper_gn_egn_comparison.csv")
          g=pd.read_csv(r/"figure5_reproduction.csv")
          lines=[
            "# Colab / CI Execution Result Report",
            "",
            "This report was generated by executing the same Python files used by the Colab notebook on GitHub Actions (Python 3.11). The committed executed notebook is `GN_Model_Colab_executed.ipynb`.",
            "",
            "## Paper 1 reproducibility",
            f"- Assessment: **{p1['assessment']}**",
            f"- Maximum equation-level relative error: **{p1['max_equation_error_pct']:.6g}%**",
            f"- Highest-resolution Sobol relative std: **{p1['qmc_convergence'][-1]['relative_std_pct']:.4f}%**",
            "",
            "## Carena 2012 Fig. 5 — GN",
            f"- Points: **{s['figure5_points']}**",
            f"- MAPE: **{s['gn_mape_pct']:.2f}%**",
            f"- Median APE: **{s['gn_median_ape_pct']:.2f}%**",
            f"- Max APE: **{s['gn_max_ape_pct']:.2f}%**",
            "",
            "## Paper vs GN vs EGN representative subset",
            f"- EGN subset points: **{s['egn_subset_points']}**",
            f"- GN MAPE on same subset: **{s['gn_same_subset_mape_pct']:.2f}%**",
            f"- EGN MAPE on same subset: **{s['egn_subset_mape_pct']:.2f}%**",
            f"- EGN median APE: **{s['egn_subset_median_ape_pct']:.2f}%**",
            f"- EGN max APE: **{s['egn_subset_max_ape_pct']:.2f}%**",
            "",
            "## Error table (same GN/EGN subset)",
            "",
            e[["fiber","modulation","spacing_GHz","paper_Lmax_km","gn_Lmax_km","egn_Lmax_km","gn_error_pct","egn_error_pct"]].to_markdown(index=False,floatfmt=".2f"),
            "",
            "## Scope notes",
          ]
          lines += [f"- {x}" for x in s["important_scope_notes"]]
          (r/"COLAB_EXECUTION_REPORT.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Commit generated validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026_KICS_Fall_10/GN_model/results/
          if git diff --cached --quiet; then
            echo "No generated result changes."
          else
            git commit -m "Add executed GN model validation results"
            git push origin HEAD:gn-model-validation-20260920
          fi
