name: LS Datacenter 3D Phase 3 Same Runner FPS Benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'DCI/DataCenter/LS_Datacenter_3D.html'
      - 'DCI/DataCenter/tests/phase3_perf_benchmark.cjs'
      - '.github/workflows/ls-datacenter-3d-phase3-benchmark.yml'
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for ephemeral run
        run: |
          mkdir -p /tmp/lsdc-phase3
          npm install --no-save --prefix /tmp/lsdc-phase3 playwright@1.56.1
          /tmp/lsdc-phase3/node_modules/.bin/playwright install --with-deps chromium
      - name: Restore committed unoptimized v4.6.0 source snapshot
        run: |
          mkdir -p DCI/DataCenter/tests/test-results/phase3/baseline
          for f in LS_Datacenter_3D.html LS_Datacenter_3D_Extensions.js LS_Datacenter_3D_Extensions.css LS_Datacenter_3D_Phase2A.js LS_Datacenter_3D_Phase2B.js LS_Datacenter_3D_Phase2.css; do
            git show 9dce7156ab9f6642f948cd814e85af1f61975f8f:DCI/DataCenter/$f > DCI/DataCenter/tests/test-results/phase3/baseline/$f
          done
      - name: Measure baseline and optimized render on same runner
        env:
          NODE_PATH: /tmp/lsdc-phase3/node_modules
        run: node DCI/DataCenter/tests/phase3_perf_benchmark.cjs
      - name: Upload FPS result and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsdc-phase3-before-after-FPS
          path: |
            DCI/DataCenter/tests/test-results/phase3/benchmark.json
            DCI/DataCenter/tests/test-results/phase3/benchmark.md
            DCI/DataCenter/tests/test-results/phase3/*.png
          retention-days: 30
      - name: Print comparison
        if: always()
        run: cat DCI/DataCenter/tests/test-results/phase3/benchmark.md || true
