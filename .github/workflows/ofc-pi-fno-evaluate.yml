name: OFC 2026 PI-EDFA FNO official-data evaluation

on:
  push:
    paths:
      - .github/workflows/ofc-pi-fno-evaluate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out research model
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            26OFC_ML_challenge/COSMOS_Transfer_Learning
            26OFC_ML_challenge/PI_EDFA_FNO_Residual
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pandas scikit-learn matplotlib
      - name: Download actual official OFC 2026 CSVs via Git LFS
        run: |
          git lfs version
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse https://github.com/ofc-ml-challenge/ofc-ml-challenge-data-code.git /tmp/ofc-data
          git -C /tmp/ofc-data sparse-checkout set Features
          git -C /tmp/ofc-data lfs install --local
          git -C /tmp/ofc-data lfs pull --include='Features/Train/train_features.csv,Features/Train/train_labels.csv,Features/Test/test_features.csv,Features/TestGround/test_features.csv,Features/TestGround/test_labels.csv' --exclude=''
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/ofc-data')
          for p in ('Features/Train/train_features.csv','Features/Train/train_labels.csv','Features/TestGround/test_features.csv','Features/TestGround/test_labels.csv'):
              f=root/p
              with f.open('rb') as inp: head=inp.read(128)
              assert f.stat().st_size>1024 and not head.startswith(b'version https://git-lfs'),f'Git LFS pointer: {f}'
              print(p,f.stat().st_size)
          PY
      - name: Train PI-EDFA and FNO; evaluate Aging SHB Unseen
        run: |
          python 26OFC_ML_challenge/PI_EDFA_FNO_Residual/train.py \
            --data-root /tmp/ofc-data \
            --output ./ofc_fno_eval \
            --pi-epochs 60 --fno-epochs 60 --patience 15 \
            --seed 2026 --cpu --evaluate-testground
      - name: Print comparison JSON
        if: success()
        run: |
          cat ofc_fno_eval/validation_comparison.json
          cat ofc_fno_eval/testground_comparison.json
      - name: Save evaluation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofc-pi-fno-evaluation-2026
          path: ofc_fno_eval
          if-no-files-found: warn
