name: OFC 2026 COSMOS transfer pilot benchmark

on:
  push:
    paths:
      - .github/workflows/ofc26-cosmos-transfer-pilot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
    steps:
      - name: Checkout user's model code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU Torch and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy pandas scikit-learn matplotlib

      - name: Clone official OFC data with Git LFS
        run: |
          git lfs install
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse https://github.com/ofc-ml-challenge/ofc-ml-challenge-data-code.git /tmp/ofcdata
          git -C /tmp/ofcdata sparse-checkout set Features
          git -C /tmp/ofcdata lfs pull --include='Features/Train/COSMOS_features.csv,Features/Train/COSMOS_labels.csv,Features/Train/train_features.csv,Features/Train/train_labels.csv,Features/Test/test_features.csv' --exclude=''
          du -h /tmp/ofcdata/Features/Train/COSMOS_features.csv /tmp/ofcdata/Features/Train/COSMOS_labels.csv

      - name: Run PILOT same-split PI-EDFA and Transformer
        run: |
          python -u 26OFC_ML_challenge/COSMOS_Transfer_Learning/train_transfer.py \
            --data-root /tmp/ofcdata \
            --output /tmp/transfer-pilot \
            --models pi-edfa transformer \
            --cosmos-max-rows 4000 \
            --cosmos-val-max-rows 500 \
            --pretrain-epochs 6 --pretrain-patience 6 \
            --finetune-epochs 55 --finetune-patience 17 \
            --pretrain-batch-size 128 --batch-size 64 \
            --cpu

      - name: Publish summarized comparison to model folder
        if: success()
        run: |
          mkdir -p 26OFC_ML_challenge/COSMOS_Transfer_Learning/benchmarks/pilot
          cp /tmp/transfer-pilot/comparison.json 26OFC_ML_challenge/COSMOS_Transfer_Learning/benchmarks/pilot/
          cp /tmp/transfer-pilot/comparison.csv 26OFC_ML_challenge/COSMOS_Transfer_Learning/benchmarks/pilot/
          python - <<'PY'
          import json, datetime, pathlib, subprocess
          j=json.loads(pathlib.Path('/tmp/transfer-pilot/comparison.json').read_text())
          lines=['# COSMOS Transfer PILOT (not full-data result)','',
                 'Automated GitHub Actions CPU experiment. 4,000 COSMOS train rows sampled; 6 pretraining epochs; 55 maximum recent Train fine-tuning epochs. Seed=2026, same Train holdout for both models and scratch baseline.','',
                 '| Model | COSMOS pretrain validation | Transfer recent-val | Scratch recent-val | Transfer-vs-scratch |',
                 '|---|---:|---:|---:|---:|']
          for model,v in j.items():
            t=v['transfer_val']['score']; s=v['scratch_val']['score']
            lines.append(f'| {model} | {v["source_val"]["score"]:.6f} | {t:.6f} | {s:.6f} | {(s-t)/s*100:+.1f}% |')
          lines+=['','The above are internal validation scores, not Kaggle final scores. TestGround is NOT evaluated in pilot. Full COSMOS pretraining has NOT been completed.']
          pathlib.Path('26OFC_ML_challenge/COSMOS_Transfer_Learning/benchmarks/pilot/README.md').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 26OFC_ML_challenge/COSMOS_Transfer_Learning/benchmarks/pilot
          git commit -m "Record OFC COSMOS pilot transfer benchmark results"
          git push

      - name: Upload weights and diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofc26-cosmos-transfer-pilot
          path: /tmp/transfer-pilot/
          retention-days: 14
          if-no-files-found: warn
