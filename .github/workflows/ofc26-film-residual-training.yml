name: OFC 2026 Residual FiLM Full Run (CPU)

on:
  push:
    paths:
      - .github/workflows/ofc26-film-residual-training.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            26OFC_ML_challenge/FiLM_Residual_Transformer
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install numpy pandas scikit-learn matplotlib
      - name: Download official COSMOS Train and TestGround
        run: |
          git lfs install
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --filter=blob:none --sparse https://github.com/ofc-ml-challenge/ofc-ml-challenge-data-code.git /tmp/ofcdata
          git -C /tmp/ofcdata sparse-checkout set Features
          git -C /tmp/ofcdata lfs pull --include='Features/Train/train_features.csv,Features/Train/train_labels.csv,Features/Train/COSMOS_features.csv,Features/Train/COSMOS_labels.csv,Features/Test/test_features.csv,Features/TestGround/test_features.csv,Features/TestGround/test_labels.csv' --exclude=''
          du -h /tmp/ofcdata/Features/Train/COSMOS_features.csv
      - name: Run regression tests before training
        run: |
          python 26OFC_ML_challenge/FiLM_Residual_Transformer/test_pipeline.py
      - name: Actual COSMOS pretraining and recent Train fine-tuning
        run: |
          cd 26OFC_ML_challenge/FiLM_Residual_Transformer
          python -u train.py \
            --data-root /tmp/ofcdata \
            --output /tmp/ofc-film-real \
            --pretrain-cosmos \
            --cosmos-max-rows 12000 \
            --pretrain-epochs 18 \
            --pretrain-patience 8 \
            --epochs 150 \
            --patience 40 \
            --pretrain-lr 0.001 \
            --lr 0.002 \
            --hidden 64 --heads 4 --layers 2 \
            --batch-size 64 \
            --curvature 0.02 --curvature-tolerance 0.05 \
            --scratch-control --cpu
          test -s /tmp/ofc-film-real/comparison.json
          test -s /tmp/ofc-film-real/recent_best.pt
          test -s /tmp/ofc-film-real/scratch_best.pt
      - name: Frozen TestGround audit (never select models using TestGround)
        run: |
          cd 26OFC_ML_challenge/FiLM_Residual_Transformer
          python -u train.py \
            --data-root /tmp/ofcdata \
            --output /tmp/ofc-film-real/transfer_testground \
            --audit-checkpoint /tmp/ofc-film-real/recent_best.pt --cpu
          python -u train.py \
            --data-root /tmp/ofcdata \
            --output /tmp/ofc-film-real/scratch_testground \
            --audit-checkpoint /tmp/ofc-film-real/scratch_best.pt --cpu
      - name: Publish results and diagnostics in repo
        run: |
          mkdir -p 26OFC_ML_challenge/FiLM_Residual_Transformer/benchmarks/2026-11-02_cpu
          target=26OFC_ML_challenge/FiLM_Residual_Transformer/benchmarks/2026-11-02_cpu
          cp /tmp/ofc-film-real/comparison.json "$target/"
          cp /tmp/ofc-film-real/recent_metrics.json "$target/"
          cp /tmp/ofc-film-real/scratch_metrics.json "$target/"
          cp /tmp/ofc-film-real/cosmos_pretrain_history.csv "$target/"
          cp /tmp/ofc-film-real/recent_history.csv "$target/"
          cp /tmp/ofc-film-real/scratch_history.csv "$target/"
          cp /tmp/ofc-film-real/recent_per_sample.csv "$target/"
          cp /tmp/ofc-film-real/scratch_per_sample.csv "$target/"
          cp /tmp/ofc-film-real/transfer_testground/frozen_checkpoint_testground_audit.json "$target/transfer_testground.json"
          cp /tmp/ofc-film-real/scratch_testground/frozen_checkpoint_testground_audit.json "$target/scratch_testground.json"
          python - <<'PY'
          import json, pathlib, datetime
          p=pathlib.Path('26OFC_ML_challenge/FiLM_Residual_Transformer/benchmarks/2026-11-02_cpu')
          val=json.loads((p/'comparison.json').read_text())
          tr=json.loads((p/'transfer_testground.json').read_text())
          sc=json.loads((p/'scratch_testground.json').read_text())
          lines=['# Actual OFC 2026 Residual-FiLM Transformer training and evaluation','',
                 'GitHub Actions CPU run. COSMOS 12,000 training samples (source subset), 18 max pretraining epochs; latest Train 150 max epochs; seed 2026; 64 hidden, 2 layers, 4 heads; LR 0.002; curvature 0.02. Scratch uses same target split, seed, and LR.','',
                 '**Caution:** This is NOT full COSMOS training. TestGround is used ONLY after frozen models were selected. Comparing scores across different splits is not fair.','',
                 '## Latest Train holdout (lower better)','',
                 '| Model | Overall | Aging | SHB | Unseen |',
                 '|---|---:|---:|---:|---:|']
          for name,key in [('COSMOS -> Train','recent_by_category'),('Train only','scratch_by_category')]:
              d=val[key]
              lines.append('| '+name+' | '+' | '.join(f'{d[k]["score"]:.6f}' if k in d else 'N/A' for k in ['ALL','aging','shb','unseen'])+' |')
          lines.extend(['','## Frozen public TestGround (post-selection; lower better)','',
                        '| Model | Overall | Aging | SHB | Unseen |','|---|---:|---:|---:|---:|'])
          for name,d in [('COSMOS -> Train',tr),('Train only',sc)]:
              lines.append('| '+name+' | '+' | '.join(f'{d[k]["score"]:.6f}' if k in d else 'N/A' for k in ['ALL','aging','shb','unseen'])+' |')
          lines.extend(['','## Reproducibility','',
                        '- Full history: `cosmos_pretrain_history.csv`, `recent_history.csv`, `scratch_history.csv`.',
                        '- Same Train split and target LR for transfer and scratch; TestGround labels excluded from training, scaler fit and epoch selection.',
                        '- `recent_per_sample.csv` and `scratch_per_sample.csv` list error by held-out Train sample.',
                        '- Best checkpoints and `submission.csv` provided as GitHub Actions artifacts, not committed due to file size.',
                        '- This is one seed and one curvature weight; further ablations needed before robust claims.'])
          (p/'README.md').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Publish OFC Residual FiLM CPU COSMOS and frozen TestGround evaluation"
          git pull --rebase origin main
          git push
      - name: Upload model checkpoints, submission and data reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofc26-film-residual-cosmos-12k-real-run
          path: /tmp/ofc-film-real/
          retention-days: 30
          if-no-files-found: warn
