name: Sync Sumitomo Electric product PDFs

on:
  push:
    paths:
      - '.github/workflows/sumitomo-pdf-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Sumitomo Electric Lightwave PDFs
        shell: bash
        run: |
          set -euo pipefail
          get() {
            url="$1"
            dest="$2"
            mkdir -p "$(dirname "$dest")"
            curl -fL --retry 3 --retry-delay 2 "$url" -o "$dest"
          }

          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2019/10/SEL_02.14.24-Vertical-Hyperscale-eXchange-Cab-Ver1_v3.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Entrance Frames/Vertical Hyperscale eXchange (V-HSX) Cabinet/SEL_02.14.24-Vertical-Hyperscale-eXchange-Cab-Ver1_v3.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2021/09/SEL_02.15.24-3K-Vertical-Hyperscale-eXchange-Cab-Ver1_v3.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Entrance Frames/3K Vertical Hyperscale eXchange (3K-V-HSX) Cabinet/SEL_02.15.24-3K-Vertical-Hyperscale-eXchange-Cab-Ver1_v3.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2017/09/SEL_02.02.24-Hyperscale-eXchange-HSX-Ver1_v3.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Entrance Frames/Hyperscale eXchange (HSX)/SEL_02.02.24-Hyperscale-eXchange-HSX-Ver1_v3.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2016/02/SEL_02.15.24-Interconnect-Panels-Ver1_v4.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Cassettes & Interconnect Panels/Interconnect Panels/SEL_02.15.24-Interconnect-Panels-Ver1_v4.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2022/01/4LD-PS-BKFHFCRC-24032022-1.2.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Ribbon Breakout & Fanout Kits/Breakout Kits for High Fiber Count Ribbon Cables/4LD-PS-BKFHFCRC-24032022-1.2.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2026/02/SEL_01.07.26_3RU-Rack-Mounted-Splice-Enclosure-FSPRM-03-K672SS_v.1.1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/3RU Rack-Mounted Splice Enclosure FSPRM-03-K672SS/SEL_01.07.26_3RU-Rack-Mounted-Splice-Enclosure-FSPRM-03-K672SS_v.1.1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2023/09/SEL_01.23.24-PrecisionFlex-Pre-Stubbed-Patch-Panels_v1.3.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/PrecisionFlex Pre-Stubbed Patch Panels/SEL_01.23.24-PrecisionFlex-Pre-Stubbed-Patch-Panels_v1.3.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2022/01/SEL_01.21.25_FTWM-01L-Ver1_v1.1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Wall Mount Enclosures/FTWM-01L Wall Mount Enclosure/SEL_01.21.25_FTWM-01L-Ver1_v1.1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2025/02/SEL_01.27.25_Pre-Terminated-LC-APC-Patching-Transit-Enclosure_Ver1_v3.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Wall Mount Enclosures/Pre-Terminated LC-APC Patching Transit Enclosure/SEL_01.27.25_Pre-Terminated-LC-APC-Patching-Transit-Enclosure_Ver1_v3.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2016/02/SEL_01.29.25_Splice-Trays_ver2_v1.2.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Splice Trays/Splice Trays/SEL_01.29.25_Splice-Trays_ver2_v1.2.pdf'


          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2023/02/SEL_02.23.23-SWK-Cable-Assemblies-Cut-Sheet_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/SWK™ Series/SWK Cable Assemblies/SEL_02.23.23-SWK-Cable-Assemblies-Cut-Sheet_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2016/02/SEL_03.14.25-PrecisionFlex-Empty-Patch-Panel_Ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/PrecisionFlex Empty Patch Panels/SEL_03.14.25-PrecisionFlex-Empty-Patch-Panel_Ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2019/12/SEL_03.25.24_Flex-Patch-Panel_Ver1_v4.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/Flex Patch Panels/SEL_03.25.24_Flex-Patch-Panel_Ver1_v4.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2023/01/SEL_04.18.24-FSPWM-12T_WallMountEnclosure_Ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Wall Mount Enclosures/FSPWM-12T Wall Mount Enclosures/SEL_04.18.24-FSPWM-12T_WallMountEnclosure_Ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2022/01/SEL_05.06.26_Cable-Breakout-Kits-for-Ribbons_Ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Ribbon Breakout & Fanout Kits/Cable Breakout Kits for Ribbons/SEL_05.06.26_Cable-Breakout-Kits-for-Ribbons_Ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2023/10/SEL_05.08.25-FTC-GP4-PR432-ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Other Enclosures/FTC-GP4-PR432/SEL_05.08.25-FTC-GP4-PR432-ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2023/10/SEL_05.08.25-FTC-GP8-PR864-ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Other Enclosures/FTC-GP8-PR864/SEL_05.08.25-FTC-GP8-PR864-ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2016/06/SEL_05.21.25-PrecisionFlex-Pre-Terminated-Patch-Panels_Ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/PrecisionFlex Pre-Terminated Patch Panels/SEL_05.21.25-PrecisionFlex-Pre-Terminated-Patch-Panels_Ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2023/01/SEL_05.30.25-FTWM-04L-Wall-Mount-Enclosure_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Wall Mount Enclosures/FTWM-04L Wall Mount Enclosure/SEL_05.30.25-FTWM-04L-Wall-Mount-Enclosure_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2017/09/SEL_02.18.26_6912F-Transition-Module_Ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Other Enclosures/6912 Fiber Transition Module/SEL_02.18.26_6912F-Transition-Module_Ver1_v1.pdf'


          # Third user-supplied PDF batch (2026-10-05)
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2017/09/SEL_08.26.26_Ultra-Hyperscale-eXchange-U-HSX_Ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Entrance Frames/Ultra Hyperscale eXchange (U-HSX)/SEL_08.26.26_Ultra-Hyperscale-eXchange-U-HSX_Ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2016/01/SEL_25.06.04_12-Fiber-Ribbon-Pigtail-Fanout-Kits_v1.1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Ribbon Breakout & Fanout Kits/12-Fiber Ribbon Pigtail Fanout Kits/SEL_25.06.04_12-Fiber-Ribbon-Pigtail-Fanout-Kits_v1.1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2022/12/SEL-01.11.23_SWK-Fiber-Patch-Panels_v1.1-print.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/SWK™ Series/SWK Fiber Patch Panels/SEL-01.11.23_SWK-Fiber-Patch-Panels_v1.1-print.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2022/12/SEL-01.12.23_SWK-Connection_v1-print.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/SWK™ Series/SWK Connector/SEL-01.12.23_SWK-Connection_v1-print.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2022/12/SEL-01.12.23_SWK-Fiber-Adapter-Panels_v1.2.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/SWK™ Series/SWK Fiber Adapter Panels/SEL-01.12.23_SWK-Fiber-Adapter-Panels_v1.2.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2021/09/SEL-04.18.24_FTWM-08L_WallMountEnclosure-_Ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Wall Mount Enclosures/FTWM-08L Wall Mount Enclosure/SEL-04.18.24_FTWM-08L_WallMountEnclosure-_Ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2016/02/SEL-07.14.26_Fiber-Protection-Sleeves-1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fusion Splicer Solutions/Fiber Protection Sleeves/SEL-07.14.26_Fiber-Protection-Sleeves-1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2017/09/SEL-10.03.23_TN-5184-Optical-Closure-version2_v3.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Other Enclosures/TN Fiber Optic Splice Closures/SEL-10.03.23_TN-5184-Optical-Closure-version2_v3.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2023/09/SEL-10.05.23_Flexible-Reel-Jumper-version1_v1.3.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Cable Assemblies/Flexible Reel Jumper/SEL-10.05.23_Flexible-Reel-Jumper-version1_v1.3.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2016/02/SpliceTrayHolderKit-0216.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fusion Splicer Solutions/Splice Tray Holder Kit/SpliceTrayHolderKit-0216.pdf'

          # Fourth user-supplied PDF batch (2026-10-05)
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2024/11/SEL_11.13.24-FTWM-04L-2D_ver1_v1.2.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Wall Mount Enclosures/FTWM-04L-2D Wall Mount Enclosure/SEL_11.13.24-FTWM-04L-2D_ver1_v1.2.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2023/03/SEL_06.07.23-Rack-Mounted-Splice-Enclosure-Ver.2_v2.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/3RU Rack-Mounted Splice Enclosure FSPRM-03/SEL_06.07.23-Rack-Mounted-Splice-Enclosure-Ver.2_v2.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2016/01/SEL_06.11.25_Cable-Assemblies_Ver1_V1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Cable Assemblies/Cable Assemblies/SEL_06.11.25_Cable-Assemblies_Ver1_V1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2019/01/SEL_08.13.25-PrecisionFlex-FOX-Splice-Cassettes_Info_Ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Cassettes & Interconnect Panels/PrecisionFlex FOX Splice Cassettes/SEL_08.13.25-PrecisionFlex-FOX-Splice-Cassettes_Info_Ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2024/11/SEL_08.26.24-2RU-Flush-Mount-Panels-Ver1_v1.1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/2RU Flush Mount Panels/SEL_08.26.24-2RU-Flush-Mount-Panels-Ver1_v1.1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2024/09/SEL_08.26.24-2RU-HD-Panels-Ver1_v4.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/2RU High Density Panels and Interconnect Panels/SEL_08.26.24-2RU-HD-Panels-Ver1_v4.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2023/09/SEL_08.31.23-PrecisionFlex-High-Density-MPO-Cassette-Panel_v1.1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/PrecisionFlex High Density MPO-LC Cassettes/SEL_08.31.23-PrecisionFlex-High-Density-MPO-Cassette-Panel_v1.1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2016/02/SEL_09.21.26_PrecisionFlex-LGX-MPO-Cassette_Ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Cassettes & Interconnect Panels/PrecisionFlex LGX MPO Cassettes/SEL_09.21.26_PrecisionFlex-LGX-MPO-Cassette_Ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2021/09/SEL_10.09.24-PF-Splice-Tray-Tray-Mounts_ver1_v1.4.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/PrecisionFlex Splice Tray & Holders/SEL_10.09.24-PF-Splice-Tray-Tray-Mounts_ver1_v1.4.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2024/11/SEL_11.13.24-FTWM-02L-2D_ver1_v1.2.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Wall Mount Enclosures/FTWM-02L-2D Wall Mount Enclosure/SEL_11.13.24-FTWM-02L-2D_ver1_v1.2.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2024/06/SEL_11.21.25_NEMA-4X-IP66-Splice-Transit-Enclosure_Ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Wall Mount Enclosures/NEMA 4X-IP66 Splice Transit Enclosure/SEL_11.21.25_NEMA-4X-IP66-Splice-Transit-Enclosure_Ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2025/08/SEL-02.02.2026_Thermal-Jacket-Remover-JR-7S-V2.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fusion Splicer Solutions/JR-7S Thermal Jacket Remover/SEL-02.02.2026_Thermal-Jacket-Remover-JR-7S-V2.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2025/08/SEL-09.11.25-Thermal-Jacket-Remover-JR-7-ver1_v1.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fusion Splicer Solutions/JR-7 Thermal Jacket Remover/SEL-09.11.25-Thermal-Jacket-Remover-JR-7-ver1_v1.pdf'
          get 'https://sumitomoelectriclightwave.com/wp-content/uploads/2022/11/SEL-10.16.23_1RULGX-Compact-Patch-Panel-Ver.2_v4.pdf' 'DCI/DataCenter/product_catalog/Sumitomo Electric/Fiber Panels & Shelves/1RU LGX Compact Patch Panel/SEL-10.16.23_1RULGX-Compact-Patch-Panel-Ver.2_v4.pdf'

      - name: Commit PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'DCI/DataCenter/product_catalog/Sumitomo Electric/'
          if git diff --cached --quiet; then
            echo 'Sumitomo PDFs already synchronized.'
            exit 0
          fi
          git commit -m 'chore(datacenter): sync Sumitomo Electric source PDFs'
          git pull --rebase origin main
          git push origin HEAD:main
