name: COMSOL WaveOptics M4-M6 Numerical Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'COMSOL/run_m4_m6_validation.py'
      - 'COMSOL/waveoptics_m4/src/**'
      - 'COMSOL/waveoptics_m5/src/**'
      - 'COMSOL/waveoptics_m6/src/**'
      - '.github/workflows/waveoptics-m4-m6-validation.yml'
permissions:
  contents: write
jobs:
  verified-results:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-independent numerical dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'matplotlib>=3.8,<4'
      - name: Run M4 3D FEM M5 spectra and M6 optimization + strict checks
        run: |
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=1
          python COMSOL/run_m4_m6_validation.py | tee /tmp/waveoptics-m4-m6-summary.log
      - name: Publish image, numerical data and reports to COMSOL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMSOL/waveoptics_m4/screenshots COMSOL/waveoptics_m5/screenshots COMSOL/waveoptics_m6/screenshots
          git add COMSOL/waveoptics_m4/M4_VALIDATION_REPORT.md COMSOL/waveoptics_m5/M5_VALIDATION_REPORT.md COMSOL/waveoptics_m6/M6_VALIDATION_REPORT.md
          git add COMSOL/WAVEOPTICS_M4_M6_EXECUTION_SUMMARY.json
          git diff --cached --quiet || { git commit -m "results: validated M4 cavity FEM M5 wavelength S and M6 inverse design [skip ci]"; git push origin HEAD:main; }
      - name: Upload numerical validation plots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waveoptics-m4-m5-m6-validated-numerical-results
          path: |
            COMSOL/waveoptics_m4/screenshots
            COMSOL/waveoptics_m5/screenshots
            COMSOL/waveoptics_m6/screenshots
            COMSOL/waveoptics_m4/M4_VALIDATION_REPORT.md
            COMSOL/waveoptics_m5/M5_VALIDATION_REPORT.md
            COMSOL/waveoptics_m6/M6_VALIDATION_REPORT.md
            COMSOL/WAVEOPTICS_M4_M6_EXECUTION_SUMMARY.json
          if-no-files-found: warn
          retention-days: 60
