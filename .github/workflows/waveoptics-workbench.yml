name: Wave Optics Python Workbench UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'COMSOL/workbench/*.py'
      - 'COMSOL/workbench/*.js'
      - 'COMSOL/workbench/*.html'
      - 'COMSOL/workbench/*.css'
      - 'COMSOL/workbench/catalog.json'
      - 'COMSOL/workbench/sample_result.json'
      - 'COMSOL/workbench/requirements.txt'
      - 'COMSOL/workbench/START_WINDOWS.bat'
      - 'COMSOL/workbench/qa/**'
      - '.github/workflows/waveoptics-workbench.yml'
  pull_request:
    paths:
      - 'COMSOL/workbench/*.py'
      - 'COMSOL/workbench/*.js'
      - 'COMSOL/workbench/*.html'
      - 'COMSOL/workbench/*.css'
      - 'COMSOL/workbench/catalog.json'
      - 'COMSOL/workbench/sample_result.json'
      - 'COMSOL/workbench/requirements.txt'
      - 'COMSOL/workbench/START_WINDOWS.bat'
      - 'COMSOL/workbench/qa/**'
permissions:
  contents: read
concurrency:
  group: optics-workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            COMSOL/workbench
            COMSOL/waveoptics_m7/src
            COMSOL/waveoptics_m8/src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install numerical dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglu1-mesa libxft2 libxrender1 libxinerama1 libxcursor1
          python -m pip install -r COMSOL/workbench/requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check browser code syntax
        run: node --check COMSOL/workbench/app.js
      - name: Verify numerical adapters and real HTTP jobs
        run: python -m pytest COMSOL/workbench/qa/test_workbench.py -q --junitxml=COMSOL/workbench/evidence/tests.xml
      - name: Verify browser workflow, exports and offline preview
        run: python COMSOL/workbench/qa/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-optics-workbench-qa
          path: COMSOL/workbench/evidence
      - name: Save the exact portable source for Windows verification
        uses: actions/upload-artifact@v4
        with:
          name: wave-optics-workbench-source
          path: COMSOL/workbench/LS_WaveOptics_Workbench_v0.1.zip
  windows-python:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LS_WaveOptics_Workbench_v0.1
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wave-optics-workbench-source
          path: .
      - name: Extract the company PC source bundle
        working-directory: .
        shell: pwsh
        run: Expand-Archive -LiteralPath LS_WaveOptics_Workbench_v0.1.zip -DestinationPath .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows numerical dependencies
        run: |
          python -m pip install -r COMSOL/workbench/requirements.txt
          python -m pip install pytest==9.1.1
      - name: Verify Windows solvers and local server worker processes
        run: python -m pytest COMSOL/workbench/qa/test_workbench.py -q --junitxml=COMSOL/workbench/evidence/windows_tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-optics-workbench-windows
          path: LS_WaveOptics_Workbench_v0.1/COMSOL/workbench/evidence/windows_tests.xml
