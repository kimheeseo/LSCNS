name: Yee vector workbench acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - 'COMSOL/universal_silica_v01/web/vector_*.mjs'
      - 'COMSOL/universal_silica_v01/web/yee_*.mjs'
      - 'COMSOL/universal_silica_v01/web/tests/*yee*.mjs'
      - '.github/workflows/yee-workbench.yml'
permissions:
  contents: read
jobs:
  workflow-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Numerical and project codec regression
        run: node COMSOL/universal_silica_v01/web/tests/test_yee.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --prefix /tmp/yee-playwright playwright@1.56.1
          /tmp/yee-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser workflow acceptance
        env:
          NODE_PATH: /tmp/yee-playwright/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/yee-http.log 2>&1 &
          node COMSOL/universal_silica_v01/web/tests/browser_yee_workbench.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yee-workbench-ui
          path: yee-workbench-ui.png
          if-no-files-found: ignore
