<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1677ff">
<title>CPO Supply Chain</title>
<style>
html,body{margin:0;min-height:100%;background:#f4f8fc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;color:#496985;text-align:center;padding:24px;box-sizing:border-box}
.boot b{display:block;color:#172a3f;font-size:20px;margin-bottom:8px}
.bar{width:min(260px,70vw);height:4px;border-radius:999px;background:#dbe8f3;overflow:hidden;margin:14px auto 0}
.bar:after{content:"";display:block;width:42%;height:100%;background:#1677ff;border-radius:inherit;animation:load .75s ease-in-out infinite alternate}
@keyframes load{from{transform:translateX(-90%)}to{transform:translateX(230%)}}
.retry{display:none;margin:14px auto 0;border:0;border-radius:999px;padding:9px 14px;background:#1677ff;color:#fff;font-weight:800}
</style>
</head>
<body>
<div class="boot"><div><b>CPO Supply Chain</b><span id="status">앱을 불러오는 중입니다.</span><div class="bar" id="bar"></div><button class="retry" id="retry" onclick="location.reload()">다시 시도</button></div></div>
<script>
(function(){
 var status=document.getElementById('status'),bar=document.getElementById('bar'),retry=document.getElementById('retry');
 function fail(){status.textContent='로딩에 실패했습니다. 다시 시도해 주세요.';bar.style.display='none';retry.style.display='block'}
 function decode(p){
   var s=atob(p),u=new Uint8Array(s.length),i;
   for(i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
   if(window.TextDecoder)return new TextDecoder('utf-8').decode(u);
   var esc='';for(i=0;i<u.length;i++)esc+='%'+('0'+u[i].toString(16)).slice(-2);
   return decodeURIComponent(esc);
 }
 fetch('./app.v2.11.1.txt',{cache:'force-cache'})
   .then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
   .then(function(p){var html=decode(p.trim());document.open();document.write(html);document.close()})
   .catch(fail);
 setTimeout(function(){if(document.getElementById('status'))status.textContent='네트워크에서 앱 데이터를 불러오는 중입니다…'},1800);
})();
</script>
</body>
</html>
