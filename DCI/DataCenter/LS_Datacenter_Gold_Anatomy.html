<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LS Gold Data Center · Anatomy Tour</title>
<style>
:root{--bg:#111d20;--panel:#f6efd5;--ink:#25312c;--gold:#e9c46a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,"Noto Sans KR",sans-serif;color:#f6efd5}header{padding:12px 16px;background:#20382f;border-bottom:4px solid #b88a46;display:flex;flex-wrap:wrap;align-items:center;gap:12px}h1{font-size:20px;margin:0}button,select{font:inherit;cursor:pointer;border:2px solid #a78c55;border-radius:7px;padding:9px 12px;background:#2c473b;color:#fff}button.active{background:#b58b42;color:#14251e;font-weight:800}.toolbar{display:flex;flex-wrap:wrap;gap:6px}.layout{max-width:1450px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:12px}.mapbox{background:#263f37;border:5px ridge #bd995b;border-radius:12px;overflow:hidden;position:relative}.maptitle{padding:10px 12px;font-weight:800;background:#1a3129;display:flex;justify-content:space-between;gap:8px}.mapscroll{overflow:auto;max-width:100%;background:#739d83}.world{position:relative;width:960px;height:660px;transform-origin:top left;background:repeating-linear-gradient(0deg,transparent 0 31px,#ffffff10 32px),repeating-linear-gradient(90deg,transparent 0 31px,#ffffff10 32px),#87aa8a}.floor{position:absolute;border:5px solid #4c635d;border-top:13px solid #a9beb0;background:#c4cbb6;box-shadow:8px 10px 0 #3b5948;border-radius:3px}.area{position:absolute;border:3px solid #314f43;background:#d2d4bf;color:#172f26;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:12px;font-weight:800;cursor:pointer;box-shadow:5px 6px #5c715e;transition:filter .12s}.area:focus,.area.selected{outline:4px solid #ffd35e;z-index:2}.area small{font-size:10px}.area .pixel{font-size:29px;filter:drop-shadow(2px 3px #0004)}.area.power{background:#dca18b}.area.cooling{background:#a0c9e1}.area.network{background:#9dd7b1}.area.operations{background:#c3afd9}.area.white{background:#e3d5aa}.area.security{background:#cfb5ad}.player{position:absolute;width:28px;height:36px;z-index:10;pointer-events:none;filter:drop-shadow(3px 4px #0007)}.player:before{content:"";position:absolute;left:6px;top:0;width:17px;height:13px;background:#d7ad83;border:3px solid #3a382f}.player:after{content:"";position:absolute;left:4px;top:15px;width:22px;height:17px;background:#d3424a;border:3px solid #39362d;box-shadow:0 8px #25375a}.wire{position:absolute;height:5px;transform-origin:left center;pointer-events:none;opacity:.8}.wire.power{background:#c7513b}.wire.cooling{background:#2e8fc0}.wire.network{background:#208b6b}.side{display:flex;flex-direction:column;gap:12px}.card{background:var(--panel);color:var(--ink);border:5px ridge #b99659;border-radius:12px;padding:14px}.card h2{margin:0 0 8px;font-size:20px}.card h3{margin:12px 0 6px;font-size:14px}.card p{line-height:1.55;margin:8px 0}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{background:#d9dfcc;border-radius:5px;padding:5px 8px;font-size:12px}.step{border-left:3px solid #b88942;padding:4px 10px;margin:4px 0}.controls{display:grid;grid-template-columns:repeat(3,52px);gap:5px;justify-content:center;margin:12px 0}.controls button{min-height:46px}.status{font-size:12px;opacity:.85}.tourlink{color:#225c48;font-weight:bold}.mode-mobile .layout{grid-template-columns:1fr}.mode-mobile .mapscroll{overflow:auto}.mode-mobile .side{display:grid;grid-template-columns:1fr}.mode-mobile .world{width:960px}.help{font-size:12px;opacity:.9;padding:4px 12px 12px}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.mapscroll{overflow:auto}.side{display:block}.card{margin-bottom:12px}header h1{width:100%}}@media(prefers-reduced-motion:reduce){.area{transition:none}}
</style></head><body>
<header><h1>✦ LS DATA CENTER · GOLD ANATOMY TOUR</h1><div class="toolbar" id="views"><button class="active" data-view="all">전체 구조</button><button data-view="power">전력·냉각</button><button data-view="white">IT Hall</button><button data-view="network">Network/MMR</button></div><div class="toolbar" id="modes"><button class="active" data-mode="auto">Auto</button><button data-mode="mobile">모바일</button><button data-mode="desktop">컴퓨터</button></div><div class="toolbar"><button id="junior">주니어 OJT</button><button id="senior">시니어</button><button id="reset">처음으로</button></div></header>
<div class="layout"><section class="mapbox"><div class="maptitle"><span id="zoneTitle">캠퍼스 · 전체 해부도</span><span id="location">현재 위치: 출입 게이트</span></div><div class="mapscroll" id="mapscroll"><div class="world" id="world"><div class="floor" style="left:170px;top:100px;width:620px;height:480px"></div><div class="player" id="player"></div></div></div><div class="help">방향키/WASD 이동 · Z/Enter 조사 · 설비를 직접 눌러도 조사할 수 있습니다.</div><div class="controls"><span></span><button data-move="up">▲</button><span></span><button data-move="left">◀</button><button id="inspect">조사</button><button data-move="right">▶</button><span></span><button data-move="down">▼</button><span></span></div></section>
<aside class="side"><section class="card" id="detail"><h2>환영합니다!</h2><p>건물과 설비 사이를 탐험하며 전력·냉각·광통신·IT 장비의 연결 관계를 확인하세요.</p></section><section class="card"><h2>탐험 노트 <span id="progress">0/0</span></h2><p>설비를 조사하면 탐험 노트가 채워집니다.</p><div class="chips" id="visited"></div><h3>전문가 자료</h3><a class="tourlink" href="./index.html" target="_blank" rel="noopener">DataCenter BOM · 업체별 제품 리스트 ↗</a><p class="status">설비별 관련 품목은 교육용 분류이며 실제 구매 수량은 BOM 계산기에서 확인합니다.</p></section></aside></div>
<script>
(()=>{
const items=[
['utility','UTILITY POWER','⚡','power',790,30,145,72,'외부 전력망에서 데이터센터로 전력을 공급합니다.','Utility → Transformer → Switchgear','MV/HV Power Cable, Control Cable','Utility Yard'],
['transformer','TRANSFORMER','🔌','power',800,120,135,72,'수전 전압을 내부 배전 전압으로 변환합니다.','Utility → Transformer → Switchgear','MV Cable, LV Cable, Termination','Utility Yard'],
['generator','GENERATOR','🛢️','power',800,215,135,72,'상용전원 장애 시 대체 전원을 공급합니다.','Generator → ATS/Switchgear → UPS','Power Cable, Control Cable, Fuel System','Utility Yard'],
['switchgear','SWITCHGEAR / ATS','🔀','power',180,120,155,72,'수전과 발전기 전원을 절체하고 보호·배전합니다.','Utility/Generator → ATS → UPS','Power Cable, Switchgear, Busduct','Electrical Room'],
['ups','UPS / BATTERY','🔋','power',365,120,150,72,'순간 정전과 발전기 기동 사이 IT 부하를 보호합니다.','ATS → UPS → PDU → Rack','Battery Cable, UPS, LV Cable','Electrical Room'],
['pdu','PDU / BUSWAY','🔴','power',550,120,175,72,'전력을 랙에 안전하게 분배합니다.','UPS → PDU/Busway → Rack PDU','Busway, Rack PDU, Power Cable','Electrical Room'],
['tower','COOLING TOWER','💧','cooling',18,22,142,78,'냉각수 계통에서 열을 외기로 방출합니다.','Cooling Tower ↔ Chiller','Cooling Tower, Pump, Pipe','Cooling Plant'],
['chiller','CHILLER / PUMP','❄️','cooling',18,122,142,78,'냉수를 만들고 순환시켜 IT 발열을 제거합니다.','Chiller → Pump → CRAH/CDU','Chiller, Pump, Pipe','Cooling Plant'],
['cdu','CDU / CRAH','🌬️','cooling',18,222,142,78,'랙 또는 실내 공조 계통으로 냉각을 전달합니다.','CRAH/CDU → IT Rack → Return','CDU, CRAH, Hose, Sensor','Cooling Plant'],
['mmr','MMR / ODF','🌐','network',185,228,155,90,'통신사업자 광회선과 데이터센터 내부망이 접속되는 구역입니다.','Carrier → ODF → Core/Spine','OS2 Fiber, ODF, Patch Panel, MPO Trunk','Network / MMR'],
['spine','SPINE SWITCH','🖧','network',360,228,155,90,'여러 Leaf 스위치를 상호 연결하는 패브릭 상위 계층입니다.','MMR/Core → Spine → Leaf','Optical Transceiver, Fiber Trunk, Switch','Network / MMR'],
['leaf','LEAF / TOR','🖧','network',535,228,155,90,'서버와 스토리지를 연결하는 패브릭 접속 계층입니다.','Spine → Leaf/ToR → Server','DAC/AEC/AOC, Transceiver, Fiber','Network / MMR'],
['rack1','COMPUTE RACK A','🗄️','white',192,355,140,94,'GPU/CPU 서버와 랙 PDU, 케이블링을 수용합니다.','Power + Cooling + Leaf → Compute','Rack, GPU Server, Power Cable, Patch Cord','White Space'],
['rack2','COMPUTE RACK B','🗄️','white',360,355,140,94,'핫/콜드 아일 및 상부 케이블 트레이와 함께 배치됩니다.','Containment ↔ CRAH/CDU','Rack, Containment, Cable Tray','White Space'],
['rack3','STORAGE / NET RACK','🗄️','white',528,355,160,94,'스토리지 및 네트워크 장비를 수용합니다.','Storage → Leaf → Spine','Rack, Switch, Fiber Patch Panel','White Space'],
['noc','NOC / OPERATIONS','🖥️','operations',185,486,155,75,'장애·전력·온도·네트워크 상태를 모니터링합니다.','Sensor → BMS/DCIM → NOC','Monitoring, Copper/Fiber Cabling','Operations'],
['security','SECURITY / GATE','🛡️','security',360,486,155,75,'출입 통제와 방문객 보안 검사를 수행합니다.','Visitor → Gate → Authorized Zone','Access Control, CCTV, Cat6A','Security'],
['fire','FIRE SUPPRESSION','🧯','security',535,486,155,75,'화재 감지·경보·소화 설비로 설비를 보호합니다.','Detector → Alarm → Suppression','Fire Alarm Cable, Detection System','Safety']
];
const $=id=>document.getElementById(id),world=$('world'),player=$('player'),visited=new Set();let pos={x:735,y:545},selected=null,view='all',level='junior',mode='auto';
function safe(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;'}[c]));}
function renderMap(){world.querySelectorAll('.area,.wire').forEach(n=>n.remove());items.forEach(a=>{const [id,name,emoji,group,x,y,w,h]=a;const b=document.createElement('button');b.type='button';b.className='area '+group+(selected===id?' selected':'');b.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px';b.dataset.id=id;b.innerHTML='<span class="pixel">'+emoji+'</span><span>'+safe(name)+'</span>';b.addEventListener('click',()=>inspect(id));if(view!=='all'&&view!=='power'&&group!==view)b.style.opacity='.22';if(view==='power'&&!['power','cooling'].includes(group))b.style.opacity='.22';world.appendChild(b);});player.style.left=pos.x+'px';player.style.top=pos.y+'px';$('zoneTitle').textContent={all:'캠퍼스 · 전체 해부도',power:'전력·냉각 설비',white:'White Space · 서버홀',network:'네트워크 · MMR'}[view];}
function inspect(id){const a=items.find(x=>x[0]===id);if(!a)return;selected=id;visited.add(id);$('location').textContent='현재 조사: '+a[1];$('detail').innerHTML='<h2>'+a[2]+' '+safe(a[1])+'</h2><p><strong>구역:</strong> '+safe(a[11])+'</p><p>'+safe(a[8])+'</p><h3>계통 흐름</h3><div class="step">'+safe(a[9])+'</div><h3>관련 BOM · LS전선 기회 품목</h3><div class="chips">'+a[10].split(', ').map(t=>'<span class="chip">'+safe(t)+'</span>').join('')+'</div><p><a class="tourlink" href="./index.html" target="_blank" rel="noopener">실제 BOM/제품 후보 조회 ↗</a></p>'+(level==='senior'?'<p class="status">시니어 검토: 이중화 구성, 용량, 커넥터/매체 호환성, 유지보수 경로를 별도 검증하세요.</p>':'<p class="status">주니어 학습: 이 설비가 앞뒤 어느 장비와 연결되는지 확인하세요.</p>');$('progress').textContent=visited.size+'/'+items.length;$('visited').innerHTML=items.filter(x=>visited.has(x[0])).map(x=>'<span class="chip">'+x[2]+' '+safe(x[1])+'</span>').join('');renderMap();}
function move(dx,dy){pos.x=Math.max(0,Math.min(930,pos.x+dx));pos.y=Math.max(0,Math.min(610,pos.y+dy));player.style.left=pos.x+'px';player.style.top=pos.y+'px';const near=items.map(a=>({id:a[0],d:Math.hypot(pos.x-(a[4]+a[6]/2),pos.y-(a[5]+a[7]/2))})).sort((a,b)=>a.d-b.d)[0];if(near.d<90)$('location').textContent='근처 설비: '+items.find(x=>x[0]===near.id)[1];}
function nearest(){const a=items.map(a=>({id:a[0],d:Math.hypot(pos.x-(a[4]+a[6]/2),pos.y-(a[5]+a[7]/2))})).sort((a,b)=>a.d-b.d)[0];inspect(a.id);}
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const d={up:[0,-32],down:[0,32],left:[-32,0],right:[32,0]}[b.dataset.move];move(...d)}));$('inspect').addEventListener('click',nearest);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;const d={ArrowUp:[0,-32],w:[0,-32],ArrowDown:[0,32],s:[0,32],ArrowLeft:[-32,0],a:[-32,0],ArrowRight:[32,0],d:[32,0]}[e.key];if(d){e.preventDefault();move(...d)}else if(e.key==='z'||e.key==='Z'||e.key==='Enter'){e.preventDefault();nearest()}});
$('views').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;$('views').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderMap()}));
function applyMode(){document.body.classList.toggle('mode-mobile',mode==='mobile'||(mode==='auto'&&innerWidth<850));}
$('modes').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;try{localStorage.setItem('ls-gold-mode',mode)}catch(e){}$('modes').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));applyMode()}));window.addEventListener('resize',applyMode);
$('junior').addEventListener('click',()=>{level='junior';if(selected)inspect(selected)});$('senior').addEventListener('click',()=>{level='senior';if(selected)inspect(selected)});$('reset').addEventListener('click',()=>{pos={x:735,y:545};selected=null;visited.clear();$('detail').innerHTML='<h2>환영합니다!</h2><p>탐험을 시작하세요.</p>';$('progress').textContent='0/'+items.length;$('visited').innerHTML='';renderMap()});
try{mode=localStorage.getItem('ls-gold-mode')||'auto'}catch(e){}$('modes').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));applyMode();$('progress').textContent='0/'+items.length;renderMap();
})();
</script></body></html>
