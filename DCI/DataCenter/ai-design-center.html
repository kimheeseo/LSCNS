<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LS AI Design Center</title><style>
:root{font-family:Inter,Pretendard,Arial;color:#eaf2ff;background:#07101e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#182b4d,#07101e 58%);min-height:100vh}.top{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #29415f;background:#091526dd;position:sticky;top:0;z-index:5}.top h1{font-size:18px;margin:0}.top a{color:#9ccaff;text-decoration:none}.wrap{max-width:1400px;margin:auto;padding:22px}.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;background:#0d1b2d;border:1px solid #29415f;border-radius:16px;padding:14px;margin-bottom:16px}.controls label{font-size:11px;color:#9fb2ca}.controls input,.controls select{width:100%;margin-top:5px;background:#07111f;color:white;border:1px solid #36506d;border-radius:8px;padding:9px}.run{background:#4b8cff;border:0;border-radius:9px;color:white;font-weight:800;padding:10px;cursor:pointer}.office{position:relative;min-height:670px;border:1px solid #29415f;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#101f35,#091322);box-shadow:0 30px 80px #0008}.floor{position:absolute;inset:70px 4% 5%;transform:skewY(-3deg);background:repeating-linear-gradient(90deg,#152944 0 80px,#19304f 80px 82px);border-radius:18px}.board{position:absolute;top:22px;left:4%;right:4%;display:flex;justify-content:space-between;background:#07101de8;border:1px solid #315071;border-radius:12px;padding:12px 18px;z-index:2}.board b{font-size:22px}.board span{color:#72e6bd}.agents{position:absolute;inset:105px 5% 5%;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;z-index:2}.agent{align-self:center;min-height:175px;padding:16px;border:1px solid #355577;background:#10223ae8;border-radius:14px;box-shadow:0 14px 25px #0007;transition:.25s}.agent.active{transform:translateY(-8px);border-color:#62a5ff;box-shadow:0 0 30px #3d8cff55}.agent.done{border-color:#3bd49a}.avatar{font-size:31px}.role{font-weight:800;margin:6px 0}.task{font-size:12px;color:#9fb2ca;min-height:34px}.metric{margin-top:10px;font-size:18px;font-weight:800;color:#fff}.state{font-size:10px;color:#72e6bd;text-transform:uppercase}.log{margin-top:16px;background:#0d1b2d;border:1px solid #29415f;border-radius:14px;padding:14px;min-height:100px}.log h3{margin:0 0 8px;font-size:13px}.log div{font-family:monospace;font-size:11px;color:#9fb2ca;line-height:1.7}@media(max-width:800px){.controls{grid-template-columns:repeat(2,1fr)}.agents{grid-template-columns:repeat(2,1fr);position:relative;inset:auto;padding:110px 18px 18px}.office{min-height:auto}.floor{display:none}.agent{min-height:150px}}
</style></head><body><header class="top"><h1>LS AI DATA CENTER · DESIGN ROOM</h1><a href="./index.html">← BOM Tool</a></header><main class="wrap">
<section class="controls"><label>GPU 수<input id="gpu" type="number" value="4096"></label><label>GPU / Server<input id="gps" type="number" value="8"></label><label>Rack IT Load kW<input id="rackkw" type="number" value="120"></label><label>PUE<input id="pue" type="number" step=".01" value="1.25"></label><label>Network<select id="speed"><option>400G</option><option selected>800G</option><option>1.6T</option></select></label><button class="run" id="run">▶ AI 설계 시작</button></section>
<section class="office"><div class="floor"></div><div class="board"><div><small>PROJECT LIVE</small><br><b id="project">4,096 GPU AI Campus</b></div><div>Engineering status<br><span id="overall">READY</span></div></div><div class="agents" id="agents"></div></section>
<section class="log"><h3>AGENT ACTIVITY</h3><div id="log">System ready. 기존 BOM Tool과 독립된 시각화 prototype입니다.</div></section></main>
<script>
const defs=[['⚡','Power Agent','IT Load / Facility Load / PUE'],['🗄️','Rack Agent','GPU Server / Rack sizing'],['🔀','Network Agent','Leaf-Spine / Port planning'],['〽️','Fiber Agent','Fiber / trunk / connector planning'],['❄️','Cooling Agent','Cooling load / liquid cooling'],['📦','BOM Agent','Catalog / product matching'],['💰','Cost Agent','Quantity / RFQ readiness'],['✓','Validation Agent','Cross-check design constraints']];
const box=document.getElementById('agents'); defs.forEach((a,i)=>box.innerHTML+=`<article class="agent" id="a${i}"><div class="avatar">${a[0]}</div><div class="role">${a[1]}</div><div class="task">${a[2]}</div><div class="metric">—</div><div class="state">IDLE</div></article>`);
const sleep=m=>new Promise(r=>setTimeout(r,m)); function calc(i){let g=+gpu.value,s=+gps.value,rkw=+rackkw.value,p=+pue.value;let servers=Math.ceil(g/s),it=servers*s*.7, racks=Math.ceil(it/rkw);let vals=[`${(it/1000).toFixed(1)} → ${(it*p/1000).toFixed(1)} MW`,`${servers} servers · ${racks} racks`,`${speed.value} fabric`,`Structured fiber candidate`,`${(it*(p-1)/1000).toFixed(1)} MW overhead`,`Catalog match queued`,`RFQ after BOM`,`PASS · assumptions flagged`];return vals[i]}
run.onclick=async()=>{run.disabled=true; overall.textContent='RUNNING'; project.textContent=(+gpu.value).toLocaleString()+' GPU AI Campus'; log.innerHTML='Design mission started…<br>'; document.querySelectorAll('.agent').forEach(x=>{x.className='agent';x.querySelector('.metric').textContent='—';x.querySelector('.state').textContent='QUEUED'});for(let i=0;i<defs.length;i++){let a=document.getElementById('a'+i);a.classList.add('active');a.querySelector('.state').textContent='WORKING';log.innerHTML+=`[${defs[i][1]}] analysing ${defs[i][2]}…<br>`;await sleep(380);a.querySelector('.metric').textContent=calc(i);a.querySelector('.state').textContent='DONE';a.classList.remove('active');a.classList.add('done')}overall.textContent='DESIGN COMPLETE';log.innerHTML+='All agents completed. Open BOM Tool for engineering-detail calculations and product catalog matching.';run.disabled=false}
</script></body></html>
