<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
<title id="title">Top-of-Rack switch detail</title><desc id="desc">Gold Pixel Tour style diagram showing fiber patch panel and cassette above a yellow highlighted one unit ToR switch, connected to five lower servers and an upper Spine Core layer.</desc>
<defs>
 <pattern id="pixel" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 7.5H8M7.5 0V8" stroke="#ffffff" stroke-opacity=".055"/></pattern>
 <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3e93d1"/></marker>
 <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e2b73e"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#35463d" flood-opacity=".25"/></filter>
</defs>
<rect width="1100" height="740" fill="#f4f0db"/><rect width="1100" height="740" fill="url(#pixel)"/>
<text x="550" y="34" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#30453b">NETWORK A · TOP-OF-RACK LAYOUT</text>
<!-- upstream fabric -->
<g filter="url(#shadow)"><rect x="285" y="52" width="530" height="66" rx="4" fill="#35464a" stroke="#1e3033" stroke-width="5"/>
<text x="550" y="80" text-anchor="middle" font-family="monospace" font-size="19" font-weight="bold" fill="#f5f1da">SPINE / CORE SWITCH LAYER</text>
<text x="550" y="103" text-anchor="middle" font-family="monospace" font-size="13" fill="#bcd5d2">UPSTREAM FABRIC</text></g>
<!-- rack frame -->
<rect x="205" y="145" width="690" height="550" rx="5" fill="#273538" stroke="#65716a" stroke-width="10" filter="url(#shadow)"/>
<rect x="221" y="161" width="658" height="518" fill="#d9dfce" stroke="#17272a" stroke-width="4"/>
<!-- upper patching -->
<rect x="247" y="178" width="606" height="43" rx="3" fill="#edf0dd" stroke="#557367" stroke-width="3"/>
<text x="550" y="196" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#344d43">FIBER PATCH PANEL</text>
<text x="550" y="213" text-anchor="middle" font-family="monospace" font-size="11" fill="#61776b">UPPER CABLE ZONE</text>
<rect x="247" y="228" width="606" height="34" rx="3" fill="#c6d8c6" stroke="#557367" stroke-width="3"/>
<text x="550" y="250" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#344d43">MPO / MTP CASSETTE · OPTICAL FAN-OUT</text>
<!-- fabric uplink distinct blue -->
<path d="M430 118V171" fill="none" stroke="#3e93d1" stroke-width="7" marker-end="url(#arrowBlue)"/>
<path d="M670 118V171" fill="none" stroke="#3e93d1" stroke-width="7" marker-end="url(#arrowBlue)"/>
<text x="550" y="139" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#2877a8">SPINE / CORE OPTICAL UPLINK</text>
<!-- switch -->
<rect x="247" y="273" width="606" height="62" rx="3" fill="#385d65" stroke="#d6a923" stroke-width="7" filter="url(#shadow)"/>
<text x="550" y="298" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ffe16a">TOP-OF-RACK SWITCH</text>
<text x="550" y="320" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#f5f1da">1U ToR · RACK TOP</text>
<g fill="#76c2cb" stroke="#193c42" stroke-width="2"><rect x="288" y="326" width="15" height="6"/><rect x="312" y="326" width="15" height="6"/><rect x="336" y="326" width="15" height="6"/><rect x="360" y="326" width="15" height="6"/><rect x="384" y="326" width="15" height="6"/><rect x="408" y="326" width="15" height="6"/><rect x="432" y="326" width="15" height="6"/><rect x="456" y="326" width="15" height="6"/><rect x="480" y="326" width="15" height="6"/><rect x="504" y="326" width="15" height="6"/><rect x="528" y="326" width="15" height="6"/><rect x="552" y="326" width="15" height="6"/><rect x="576" y="326" width="15" height="6"/><rect x="600" y="326" width="15" height="6"/><rect x="624" y="326" width="15" height="6"/><rect x="648" y="326" width="15" height="6"/><rect x="672" y="326" width="15" height="6"/><rect x="696" y="326" width="15" height="6"/><rect x="720" y="326" width="15" height="6"/><rect x="744" y="326" width="15" height="6"/><rect x="768" y="326" width="15" height="6"/><rect x="792" y="326" width="15" height="6"/></g>
<!-- five server units -->
<g font-family="monospace" font-weight="bold" fill="#e9eee0" stroke="#64716c" stroke-width="2">
<g><rect x="270" y="365" width="560" height="48" rx="3" fill="#53615e"/><text x="292" y="395" font-size="15" stroke="none">SERVER 01</text><rect x="500" y="378" width="145" height="20" fill="#26383a"/><rect x="778" y="377" width="34" height="21" fill="#163c43" stroke="#64b5c0"/></g>
<g><rect x="270" y="423" width="560" height="48" rx="3" fill="#53615e"/><text x="292" y="453" font-size="15" stroke="none">SERVER 02</text><rect x="500" y="436" width="145" height="20" fill="#26383a"/><rect x="778" y="435" width="34" height="21" fill="#163c43" stroke="#64b5c0"/></g>
<g><rect x="270" y="481" width="560" height="48" rx="3" fill="#53615e"/><text x="292" y="511" font-size="15" stroke="none">SERVER 03</text><rect x="500" y="494" width="145" height="20" fill="#26383a"/><rect x="778" y="493" width="34" height="21" fill="#163c43" stroke="#64b5c0"/></g>
<g><rect x="270" y="539" width="560" height="48" rx="3" fill="#53615e"/><text x="292" y="569" font-size="15" stroke="none">SERVER 04</text><rect x="500" y="552" width="145" height="20" fill="#26383a"/><rect x="778" y="551" width="34" height="21" fill="#163c43" stroke="#64b5c0"/></g>
<g><rect x="270" y="597" width="560" height="48" rx="3" fill="#53615e"/><text x="292" y="627" font-size="15" stroke="none">SERVER 05</text><rect x="500" y="610" width="145" height="20" fill="#26383a"/><rect x="778" y="609" width="34" height="21" fill="#163c43" stroke="#64b5c0"/></g></g>
<!-- short in-rack connections -->
<g fill="none" stroke="#e2b73e" stroke-width="4" opacity=".95">
<path d="M345 335V350Q345 360 390 360V377" marker-end="url(#arrowGold)"/>
<path d="M405 335V352Q405 418 440 418V435" marker-end="url(#arrowGold)"/>
<path d="M465 335V352Q465 476 490 476V493" marker-end="url(#arrowGold)"/>
<path d="M525 335V352Q525 534 540 534V551" marker-end="url(#arrowGold)"/>
<path d="M585 335V352Q585 592 590 592V609" marker-end="url(#arrowGold)"/>
</g>
<g font-family="monospace" fill="#344b42">
<text x="550" y="668" text-anchor="middle" font-size="14" font-weight="bold">ToR → Server NIC : DAC / AEC / AOC (짧은 랙 내부 연결)</text>
<g transform="translate(45 210)"><rect width="135" height="100" rx="4" fill="#fff8db" stroke="#b89739" stroke-width="3"/><text x="67" y="30" text-anchor="middle" font-size="15" font-weight="bold">랙 상단</text><text x="67" y="56" text-anchor="middle" font-size="13">광 패치 영역</text><text x="67" y="78" text-anchor="middle" font-size="13">→ 1U ToR</text></g>
<g transform="translate(920 260)"><rect width="150" height="126" rx="4" fill="#fff8db" stroke="#b89739" stroke-width="3"/><text x="75" y="28" text-anchor="middle" font-size="15" font-weight="bold">랙 내부</text><text x="75" y="56" text-anchor="middle" font-size="13">ToR 아래쪽</text><text x="75" y="80" text-anchor="middle" font-size="13">서버 5대</text><text x="75" y="105" text-anchor="middle" font-size="12">NIC로 연결</text></g>
</g>
<g transform="translate(920 420)" font-family="monospace" font-size="13" font-weight="bold"><path d="M0 0H36" stroke="#3e93d1" stroke-width="6"/><text x="46" y="5" fill="#2877a8">Spine/Core Uplink</text><path d="M0 32H36" stroke="#e2b73e" stroke-width="5"/><text x="46" y="37" fill="#77601f">DAC/AEC/AOC to NIC</text></g>
<text x="550" y="718" text-anchor="middle" font-family="monospace" font-size="12" fill="#657267">교육용 개념도 · 실제 포트 수와 미디어는 설계에 따라 달라집니다.</text>
</svg>